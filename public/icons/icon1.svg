<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Ludodex app icon · Void: the 2×2 tile mark (boot splash / share card / picker),
       diagonal pair selected with the swipe between them. Generated 2026-10; render with
       scripts/generate-icons.cjs. Keep the bg <rect> on its own line (the script strips it
       for Android adaptive foregrounds). -->
  <defs>
    <linearGradient id="idle" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e2236"/><stop offset="100%" stop-color="#131824"/></linearGradient>
    <linearGradient id="sel" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0d3a42"/><stop offset="100%" stop-color="#071e26"/></linearGradient>
    <linearGradient id="path" gradientUnits="userSpaceOnUse" x1="330" y1="330" x2="694" y2="694"><stop offset="0%" stop-color="#8a7bff"/><stop offset="100%" stop-color="#00d4e8"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#00d4e8" stop-opacity="0.6"/><stop offset="100%" stop-color="#00d4e8" stop-opacity="0"/></radialGradient>
    <filter id="selGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22" in="SourceAlpha" result="b"/><feFlood flood-color="#00d4e8" flood-opacity="0.75"/><feComposite in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="pathGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16" in="SourceAlpha" result="b"/><feFlood flood-color="#8a7bff" flood-opacity="0.6"/><feComposite in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="dotGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12" in="SourceAlpha" result="b"/><feFlood flood-color="#00d4e8" flood-opacity="0.9"/><feComposite in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1024" height="1024" fill="#000000" />
  <circle cx="512" cy="512" r="500" fill="url(#glow)" />
  <rect x="180" y="180" width="300" height="300" rx="64" fill="url(#sel)" stroke="#00d4e8" stroke-width="22" filter="url(#selGlow)" />
  <rect x="544" y="180" width="300" height="300" rx="64" fill="url(#idle)" stroke="#2a3148" stroke-width="22" />
  <rect x="180" y="544" width="300" height="300" rx="64" fill="url(#idle)" stroke="#2a3148" stroke-width="22" />
  <rect x="544" y="544" width="300" height="300" rx="64" fill="url(#sel)" stroke="#00d4e8" stroke-width="22" filter="url(#selGlow)" />
  <line x1="330" y1="330" x2="694" y2="694" stroke="url(#path)" stroke-width="74" stroke-linecap="round" filter="url(#pathGlow)" />
  <circle cx="330" cy="330" r="46" fill="#ffffff" filter="url(#dotGlow)" />
  <circle cx="694" cy="694" r="46" fill="#ffffff" filter="url(#dotGlow)" />
</svg>

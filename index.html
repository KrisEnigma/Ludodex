<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090e" />
    <title>Ludodex — Daily video game word puzzle</title>
    <meta name="description" content="A daily word puzzle for gamers. Swipe to connect letters and find characters, items, locations, hardware, and studios from gaming history. New puzzle every day." />

    <!-- Open Graph — used by Slack, iMessage, WhatsApp, Discord, Facebook,
         LinkedIn, etc. for link previews. Values are static (don't update
         per-puzzle) because the SPA renders client-side and scrapers
         don't run JS. If a per-puzzle preview ever matters, that's a
         server-side rendering / Cloudflare OG image generation task. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ludodex" />
    <meta property="og:title" content="Ludodex — Daily video game word puzzle" />
    <meta property="og:description" content="A daily word puzzle for gamers. Swipe to connect letters and find characters, items, locations, hardware, and studios from gaming history." />
    <meta property="og:url" content="https://ludodex.krisenigma.com" />
    <meta property="og:image" content="https://ludodex.krisenigma.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ludodex — a glowing cyan 4×4 grid of letters on a near-black background" />

    <!-- Twitter Card. summary_large_image gives the wide preview card on
         X, the variant most users see in feeds. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ludodex — Daily video game word puzzle" />
    <meta name="twitter:description" content="A daily word puzzle for gamers. Swipe to connect letters and find characters, items, locations, hardware, and studios from gaming history." />
    <meta name="twitter:image" content="https://ludodex.krisenigma.com/og-image.png" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <!-- Boot splash: visible from the first paint until Router mounts (its
         constructor replaces #app's children). Covers the wait for i18n +
         remote catalog (≤1.8 s). Inline + self-contained because no app CSS or
         fonts exist yet; colours mirror the Void / Lumen skin tokens in
         src/skins/skins.css (the one sanctioned hex exception outside it). -->
    <style>
      .boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 35%, #0d1118, #07090e);
      }
      .boot-grid {
        display: grid;
        grid-template-columns: repeat(2, 28px);
        gap: 8px;
      }
      .boot-grid span {
        width: 28px;
        height: 28px;
        border-radius: 7px;
        border: 2px solid #00d4e8;
        box-shadow: 0 0 12px rgba(0, 212, 232, 0.35);
        opacity: 0.25;
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      .boot-grid span:nth-child(2) { animation-delay: 0.15s; }
      .boot-grid span:nth-child(4) { animation-delay: 0.3s; }
      .boot-grid span:nth-child(3) { animation-delay: 0.45s; }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.25; }
        40%      { opacity: 1; }
      }
      /* Boot-error screen (main.ts renderBootError) — shown only if startup fails. */
      .boot-error-box {
        max-width: 300px;
        padding: 0 24px;
        text-align: center;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        color: #e6edf5;
      }
      .boot-error-title { margin: 0 0 8px; font-size: 16px; font-weight: 700; }
      .boot-error-body { margin: 0 0 20px; font-size: 13px; line-height: 1.5; opacity: 0.7; }
      .boot-error-retry {
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 12px 28px;
        border: none;
        border-radius: 10px;
        background: #00d4e8;
        color: #07090e;
        cursor: pointer;
      }
      @media (prefers-color-scheme: light) {
        .boot-splash { background: radial-gradient(circle at 50% 35%, #eef2f6, #d4dae2); }
        .boot-grid span { border-color: #0094ab; box-shadow: 0 0 12px rgba(0, 148, 171, 0.25); }
        .boot-error-box { color: #1a2230; }
        .boot-error-retry { background: #0094ab; color: #ffffff; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-grid span { animation: none; opacity: 0.8; }
      }
    </style>
    <div id="app">
      <div class="boot-splash" aria-hidden="true">
        <div class="boot-grid"><span></span><span></span><span></span><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
